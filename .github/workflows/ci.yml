name: CI/CD SkillHub EC06

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  laravel:
    name: Laravel - lint, test, sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillhub-back
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Doit matcher la version PHP locale utilisee pour generer composer.lock
          # (8.4 ici) : composer verrouille des paquets Symfony 8.x qui exigent
          # PHP >=8.4.1, donc un runner en 8.3 fait echouer "composer install".
          php-version: "8.4"
          # Liste alignee sur `composer check-platform-reqs` (requis reels du
          # lock, notamment ext-sodium introduit par lcobucci/jwt v5 via
          # tymon/jwt-auth) plutot que de compter sur les extensions par
          # defaut du runner.
          extensions: mbstring, pdo_sqlite, bcmath, zip, curl, ctype, dom, fileinfo, filter, hash, iconv, json, libxml, openssl, pcre, phar, session, sodium, tokenizer, xml, xmlwriter
          coverage: xdebug

      - name: Install dependencies (composer install)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Lint (php-cs-fixer via Laravel Pint)
        run: vendor/bin/pint --test

      - name: Tests unitaires et fonctionnels (php artisan test)
        run: php artisan test --coverage-clover=coverage.xml

      - name: SonarCloud - analyse qualite (skillhub-back)
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: skillhub-back
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  spring-boot:
    name: Spring Boot SSO - test, sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillhub-sso
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install dependencies (mvn install)
        run: mvn -B install -DskipTests

      - name: Tests unitaires (mvn test)
        run: mvn -B test

      - name: SonarCloud - analyse qualite (skillhub-sso)
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: Build & push les images Docker
    needs: [laravel, spring-boot]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & push l'image Laravel (skillhub-back)
        uses: docker/build-push-action@v6
        with:
          context: ./skillhub-back
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/skillhub-back:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/skillhub-back:${{ github.ref_name }}

      - name: Build & push l'image Spring Boot SSO (skillhub-sso)
        uses: docker/build-push-action@v6
        with:
          context: ./skillhub-sso
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/skillhub-sso:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/skillhub-sso:${{ github.ref_name }}
